name: Quarto PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main, master ]

# Cancel previous builds if a user pushes new commits to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
    
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt install libcurl4-openssl-dev libnode-dev libx11-dev pandoc libfontconfig1-dev libfreetype6-dev gsfonts libcairo2-dev libmagick++-dev

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'

      - name: Cache R packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/R/renv
          key: ${{ runner.os }}-renv-${{ hashFiles('**/renv.lock') }}
          restore-keys: |
            ${{ runner.os }}-renv-

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      - name: Run R data script
        run: Rscript R/pull_data.R

      # 2. Official Quarto Render Action
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2

      # 3. Handle PR Previews (Deploy or Cleanup)
      - name: Deploy PR Preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: _site  # Default Quarto output directory (change to docs if specified in your _quarto.yml)
          preview-branch: gh-pages
          umbrella-dir: pr-preview
