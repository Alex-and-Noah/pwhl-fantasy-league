on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main, master ]

name: Weekly Update

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container:
      image: rocker/geospatial:latest # Already contains Quarto, R, Pandoc, Cairo, Magick, Curl, etc.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2

      - name: Run R data script
        run: Rscript R/pull_data.R

      - name: Run R weekly update
        run: Rscript R/weekly_update.R

      - name: Commit rds email files
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add -f data/emails/
          git commit -m "Update rds files" || echo "No changes to commit"
          git push
