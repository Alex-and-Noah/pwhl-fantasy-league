on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [ main, master ]

name: Weekly Update

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container:
      image: rocker/geospatial:latest # Pre-installed with R, Quarto, and all system libraries
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install R Dependencies
        uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 2 # Automatically manages renv caching without needing actions/cache
          sysreqs: true

      - name: Ensure data directories exist
        run: mkdir -p data/emails

      - name: Run R data script
        run: Rscript R/pull_data.R

      - name: Run R weekly update
        run: Rscript R/weekly_update.R

      - name: Commit data files to isolated branch
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          
          # Switch to a clean, isolated branch for data tracking
          git checkout -B data
          
          git add -f data/
          git commit -m "Automated data snapshot: $(date -u +'%Y-%m-%d %H:%M:%S') UTC" || echo "No changes to commit"
          
          # Force push updates cleanly to the isolated remote branch
          git push origin data --force
